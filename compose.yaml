# podman compose up -d --build
#
# DB_BIND is deliberately 0.0.0.0: Postgres is reachable from the internet, as asked. That is
# the one knob to change — set DB_BIND=127.0.0.1 in .env and the database is local-only again
# without touching anything else.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elhawarey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-elhawarey}
      # brute force is a certainty on a public port, so no md5 and no trust
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
    ports:
      # host port only — inside the pod the app always talks to db:5432
      - '${DB_BIND:-0.0.0.0}:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-elhawarey}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    # plain form: older podman-compose ignores healthcheck conditions anyway, and the app's
    # entrypoint waits for the database itself
    depends_on:
      - db
    environment:
      # inside the pod the database is a service name, never the public address
      DATABASE_URL: postgres://${POSTGRES_USER:-elhawarey}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-elhawarey}
      # The public https address nginx serves. adapter-node treats this as the site's real
      # address — it rejects form posts whose Origin differs, and it makes PROTOCOL_HEADER /
      # HOST_HEADER redundant, so they are deliberately not set.
      ORIGIN: ${ORIGIN:?set ORIGIN, e.g. https://elhawarey.com}
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: 512K
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000'

volumes:
  pgdata:
